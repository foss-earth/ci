name: Attribution
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
permissions:
  contents: read
jobs:
  attribution:
    uses: foss-earth/ci/.github/workflows/attribution.yml@5f26ec87f4ab47939eec6930c5d8d89bc4b23e4a
    with:
      validator-revision: 5f26ec87f4ab47939eec6930c5d8d89bc4b23e4a
      source-repository: ${{ github.repository }}
    permissions:
      contents: read
