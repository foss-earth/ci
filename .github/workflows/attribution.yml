name: Common attribution
on:
  workflow_call:
    inputs:
      validator-revision:
        required: true
        type: string
      source-repository:
        required: true
        type: string
permissions:
  contents: read
jobs:
  policy:
    name: Attribution policy
    runs-on: ubuntu-24.04
    steps:
      - name: Read candidate common component
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: foss-earth/ci
          ref: ${{ inputs.validator-revision }}
          persist-credentials: false
      - name: Set declared Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: false
      - name: Verify trusted implementation bytes
        shell: bash
        run: |
          sha256sum --check <<'TRUSTED_FILES'
          d085a9a6de1aaf7283c864962d6d82fa11543c6011cc77e07a09b572d4411f2b  src/audit.mjs
          8a1224dae838d43aae4c9ad32369420a1b803d80d6c6006e193aac762cfd0573  src/candidate.mjs
          4ffcb74504d58d039ca8599765b8a239c089c905b14a2758b691dc99e4c1266a  src/conformance.mjs
          ce548c40f8e968780677f2ecf82f7ae373428bc0aefa0b57e0b31c4b7bead365  src/controller.mjs
          64e016196d0330031b6dd609a93ecd6f136856a4c9ab8421d5d3aeff13db6889  src/fixtures.mjs
          0a01fb07aded828787dd42706022226a442627a3e5ef446d469bff466db1a4e1  src/git.mjs
          1a1af0fd6293ccb8eecd155addfcd1079e486001179cff68d86f3d425876cab9  src/github-checks.mjs
          9a36a41a6b61a1feb133896f0760b6a385feafc1dac5a1105fc85580882d3266  src/hosted-conformance.mjs
          60e095b1a76277e113347550e5208d6cc2e6d99eb498aee6ddd355eca6465cc3  src/hosted-subject.mjs
          d698c4b8ae6404d6595e836c3ecba4c10cc87453309d6e93b14f88d4f882a18d  src/policy.mjs
          c4b019226f58f3339ece8b545137226a3cf9a46dde7895f36d6cec3c0c63a1ef  src/templates.mjs
          a9a49c9d0f0592cabe132c08f1c34e79bad0097bb97a01b57f3ff4b529ccd3d7  bin/attribution.mjs
          b067efed3f64c9e2c99e6ef8600abb1136e576cb56988946f259f12d3c8c3670  bin/candidate.mjs
          a62d7a29ddd7f19eba9f5d71fefe5eec49c3fc5000ea6ffd5a9356a2663ffe1a  bin/conformance.mjs
          f9dae9c154996149b3edd8be04f632a3ad05d0dc76f6a97544fc0f5e037b93ff  bin/hosted.mjs
          cc31c34c848f3ac88f7d23734a98a9f72b139d7ecf5c3c0f4a178bd1b2b0c3b2  bin/scaffold.mjs
          9ca88bf5861685e22e65e5f39fa65b05faaf9c218875fccbecce1b9f2dca5bd3  policy/attribution-v1.json
          66c472b358ad4e2a2d9cd1d1c2402e2831dcef91904b509a39bc9aca0cfb41a3  fixtures/matrix-v1.json
          TRUSTED_FILES
      - name: Validate raw metadata from explicit event source
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        run: node bin/hosted.mjs
